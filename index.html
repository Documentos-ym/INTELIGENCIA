{t:'Medidas y Acciones',h:`<div class="g">${C('f1','Ranking de medidas necesarias',4)}${C('f2','Treemap: factor de decisión',4)}${C('f3','Pareto de medidas',4)}${C('f4','Pareto de factores de decisión',6)}${C('f5','Matriz de correlación (V de Cramér) entre las 15 variables',6,'t')}</div>`,
f:rs=>{bar('f1',rs,'medidas',7,2);hier('f2',rs,['variables'],'treemap');par('f3',rs,'medidas',7,1);par('f4',rs,'variables',9,3);cor('f5',rs)},
c:rs=>{const[me,mp]=sh(rs,'medidas'),[v,vp]=sh(rs,'variables'),q=VP[0]||['–','–',0];return`Medida líder: <b>${me}</b> (${mp}%). Factor de decisión más citado: <b>${v}</b> (${vp}%). Mayor asociación estadística: <b>${q[0]} × ${q[1]}</b> (V=${q[2].toFixed(2)}); asociaciones por debajo de 0,2 se consideran débiles.`}},
{t:'Análisis Multivariable',h:`<div class="g"><div class="card s12"><h3>Matriz dinámica: cruce de variables <span class="seg" id="pre">${PRE.map((x,i)=>`<button onclick="HX.a='${x[1]}';HX.b='${x[2]}';render()">${x[0]}</button>`).join('')}</span></h3><div class="seg" style="margin-bottom:8px">Filas <select id="xa" onchange="HX.a=this.value;render()">${OP}</select> Columnas <select id="xb" onchange="HX.b=this.value;render()">${OP}</select> Valor <select id="xm" onchange="HX.m=this.value;render()"><option value="row">% por fila</option><option value="col">% por columna</option><option value="n">Conteo</option></select></div><div id="g1" class="ch t"></div></div>${C('g2','Clusters de segmentos (estamento × sistema): conocimiento vs capacitación',6,'t')}${C('g3','Brecha de capacitación: segmentos con mayor % sin formación',6,'t')}</div>`,
f:rs=>{$('#xa').value=HX.a;$('#xb').value=HX.b;$('#xm').value=HX.m;hm('g1',rs,HX.a,HX.b,HX.m);scat('g2',rs);barP('g3',seg(rs,['estamento','sistema']).map(x=>[x.l,100-x.ca]).sort((a,b)=>b[1]-a[1]).slice(0,10),3)},
c:rs=>{const g=seg(rs,['estamento','sistema']),cs=[...g].sort((a,b)=>a.ca-b.ca)[0]||{};const a=seg(rs,['edad']);const w=[...a].sort((x,y)=>x.co-y.co)[0]||{};return`Mayor necesidad de capacitación: <b>${cs.l||'–'}</b> (solo ${p(cs.ca)} formado). Menor conocimiento por edad: <b>${w.l||'–'}</b> (${p(w.co)}). Los clusters agrupan segmentos con n≥30 mediante k-means (k=3) sobre conocimiento, capacitación y medición.`}},
{t:'Insights Estratégicos',h:`<div class="g" id="ins"></div>`,f:rs=>insights(rs),c:()=>'Conclusiones generadas automáticamente a partir de los filtros activos: cambie los segmentadores para recalcular hallazgos, riesgos y recomendaciones.'}
];
function insights(rs){const m=met(rs),n=m.n||1,T=k=>tp(rs,k),t1=k=>{const t=T(k)[0]||['–',0];return[t[0],f1(pct(t[1],n))]},q=(k,l)=>f1(pct(rs.filter(r=>is(r,k,l)).length,n)),idea=q('conoce','Tiene una idea'),no=q('conoce','No sabe'),[f,fp]=t1('ods_fam'),[o,op]=t1('ods_org'),[u,up]=t1('ods_urg'),[a,ap]=t1('actor'),[me,mp]=t1('medidas'),[v,vp]=t1('variables'),t3=pct(T('ods_urg').slice(0,3).reduce((s,x)=>s+x[1],0),n),sg=seg(rs,['estamento','sistema']),lo=sg[0]||{},hi=sg.at(-1)||{},cs=[...sg].sort((x,y)=>x.ca-y.ca)[0]||{},ks=[...seg(rs,['edad'])].sort((x,y)=>x.co-y.co)[0]||{},sd=f1(pct(rs.filter(r=>r.some((x,i)=>L[K[i]][x]==='Sin dato')).length,n)),a2=T('actor')[1]||['–'],a3=T('actor')[2]||['–'],ah=sg.find(x=>x.l.includes('Alta Gerencia'))||{},tg=Math.min(100,Math.round(m.ca)+25);
const FI=[`Base de <b>${m.n.toLocaleString('es')}</b> registros: <b>${p(m.co)}</b> conoce a fondo el DS, ${idea}% solo tiene una idea y ${no}% no lo conoce.`,`Solo <b>${p(m.ca)}</b> recibió capacitación en ODS: brecha de formación de ${f1(100-m.ca)} pp.`,`Apenas <b>${p(m.mi)}</b> percibe que la organización mide su progreso en sostenibilidad.`,`<b>${p(m.me)}</b> relaciona acciones con ODS revisando metas; el resto se guía por el nombre del objetivo.`,`ODS prioritario para la familia: <b>${f}</b> (${fp}%).`,`ODS más relevante para la organización: <b>${o}</b> (${op}%).`,`ODS que exige acción más urgente: <b>${u}</b> (${up}%); los tres primeros concentran ${f1(t3)}% de las respuestas.`,`Actor principal para impulsar los ODS: <b>${a}</b> (${ap}%), seguido de ${a2[0]} y ${a3[0]}.`,`Medida más respaldada: <b>${me}</b> (${mp}%); factor de decisión más citado: <b>${v}</b> (${vp}%).`,`Mejor posicionado: <b>${hi.l||'–'}</b> (índice ${f1(hi.sc)}); más crítico: <b>${lo.l||'–'}</b> (índice ${f1(lo.sc)}).`];
const OPP=[`Priorizar la capacitación en <b>${cs.l||'–'}</b>, segmento con menor formación (${p(cs.ca)}).`,`Reforzar el conocimiento básico en el grupo de edad <b>${ks.l||'–'}</b> (${p(ks.co)} conoce a fondo).`,`Implantar un sistema de medición visible: hoy solo ${p(m.mi)} lo percibe.`,o!==u?`Cerrar la brecha entre lo relevante para la organización (${o}) y lo urgente (${u}).`:`Convertir la coincidencia en ${o} en metas e indicadores corporativos.`,`Formar en metas y no solo en nombres de ODS: ${p(100-m.me)} los asocia de forma superficial.`,`Activar alianzas con ${a2[0]} y ${a3[0]}, actores con respaldo relevante.`,`Escalar las campañas de sensibilización (respaldadas por ${q('medidas','Campañas de sensibilización')}%).`,`Traducir el factor «${v}» en una política operativa con responsables.`,`Mejorar la calidad del dato: ${sd}% de los registros tiene alguna variable sin respuesta.`,`Fortalecer a Alta Gerencia (${ah.n||0} resp.): conocimiento ${p(ah.co)}, capacitación ${p(ah.ca)}.`];
const REC=[`Lanzar un programa integral de formación en ODS con meta de llevar la capacitación de ${p(m.ca)} a ${tg}%.`,`Crear un Comité de Sostenibilidad liderado por Alta Gerencia con indicadores trimestrales.`,`Mantener este tablero como instrumento permanente con encuesta semestral.`,`Elaborar una hoja de ruta para ${u}, ${o} y ${f}, con metas y presupuesto.`,`Integrar la sostenibilidad en la agenda institucional (${me}).`,`Diseñar comunicación segmentada para el segmento crítico: ${lo.l||'–'}.`,`Formalizar alianzas con ${a2[0]} y ${a3[0]} para corresponsabilidad.`,`Fortalecer políticas de compra sostenible y manejo de proveedores.`,`Establecer mecanismos de reporte y cumplimiento con auditoría interna.`,`Promover códigos de conducta e incentivos que consoliden la cultura de sostenibilidad.`];
const li=a=>`<ol>${a.map(x=>`<li>${x}</li>`).join('')}</ol>`,tb=s=>`<div class="tw"><table><tr><th>Segmento</th><th>n</th><th>Conoce</th><th>Capac.</th><th>Mide</th><th>Índice</th></tr>${s.map(x=>`<tr><td>${x.l}</td><td>${x.n}</td><td>${p(x.co)}</td><td>${p(x.ca)}</td><td>${p(x.mi)}</td><td>${f1(x.sc)}</td></tr>`).join('')}</table></div>`;
const CO=[`La organización parte de una base amplia de <b>${m.n.toLocaleString('es')}</b> respuestas. Existe familiaridad con el Desarrollo Sostenible (${p(m.co)} lo conoce a fondo), pero la formación formal en ODS alcanza solo ${p(m.ca)}.`,`Las prioridades se concentran en ${f}, ${o} y ${u}. ${o!==u?'La relevancia corporativa y la urgencia percibida no coinciden, lo que exige conciliar agendas.':'Relevancia y urgencia coinciden, lo que facilita enfocar recursos.'}`,`La gobernanza se percibe liderada por ${a}, con ${a2[0]} y ${a3[0]} como corresponsables. Las medidas preferidas apuntan a «${me}», más que a presión o sanción externa.`,`El mayor riesgo es la brecha entre percepción y capacidad: ${p(m.mi)} ve mediciones de progreso y la capacitación es baja en segmentos como ${cs.l||'–'}.`,`Se recomienda un plan de tres frentes: formación segmentada, medición y reporte, y gobierno corporativo con alianzas, usando este tablero para el seguimiento.`];
const JD=`<p><b>Situación.</b> ${m.n.toLocaleString('es')} respuestas; ${p(m.co)} conoce el DS a fondo, ${p(m.ca)} capacitado, ${p(m.mi)} percibe medición.</p><p><b>Prioridades.</b> Familia: ${f}. Organización: ${o}. Urgencia: ${u}. Actor líder: ${a}.</p><p><b>Riesgos.</b> Brecha de formación (${f1(100-m.ca)} pp), baja visibilidad de la medición y segmento crítico en ${lo.l||'–'}.</p><p><b>Oportunidades.</b> Mejor segmento: ${hi.l||'–'}; respaldo a «${me}»; alianzas con ${a2[0]} y ${a3[0]}.</p><p><b>Decisiones solicitadas.</b> (1) Aprobar el programa de capacitación con meta ${tg}%. (2) Crear el Comité de Sostenibilidad. (3) Implantar indicadores trimestrales por ODS priorizado.</p>`;
$('#ins').innerHTML=`<div class="card s4"><h3>10 hallazgos estratégicos</h3>${li(FI)}</div><div class="card s4"><h3>10 oportunidades de mejora</h3>${li(OPP)}</div><div class="card s4"><h3>10 recomendaciones</h3>${li(REC)}</div><div class="card s6"><h3 style="color:#f5b5cf">Segmentos críticos (estamento × sistema)</h3>${tb(sg.slice(0,6))}</div><div class="card s6"><h3 style="color:#8fe3c3">Segmentos mejor posicionados</h3>${tb(sg.slice(-6).reverse())}</div><div class="card s12 rep"><h3>Informe final: conclusión ejecutiva gerencial</h3>${CO.map(x=>`<p>${x}</p>`).join('')}</div><div class="card s12 rep"><h3>Resumen ejecutivo para junta directiva</h3>${JD}</div>`}
function go(i){pg=i;$('#pg').innerHTML=PG[i].h+'<div class="cl"><h4>Conclusión automática</h4><div id="cl"></div></div>';document.querySelectorAll('.nb').forEach((b,j)=>b.classList.toggle('on',j===i));render();scrollTo({top:0,behavior:'smooth'})}
function tog(k,l){if(!k)return;const i=L[k].indexOf(l);if(i<0)return;(F[k]??=new Set());F[k].has(i)?F[k].delete(i):F[k].add(i);render()}
function render(){const rs=rows();document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',!!F[b.dataset.k]?.has(+b.dataset.i)));$('#act').innerHTML=Object.entries(F).flatMap(([k,s])=>[...s].map(i=>`<button class="tag" onclick="tog('${k}','${L[k][i]}')">${NM[k]}: ${L[k][i]} ✕</button>`)).join('');$('#cnt').textContent=`${rs.length.toLocaleString('es')} de ${N.toLocaleString('es')} registros`;PG[pg].f(rs);$('#cl').innerHTML=PG[pg].c(rs)}
function recs(){const rs=rows();$('#mt').innerHTML='<tr>'+K.map(k=>`<th>${NM[k]}</th>`).join('')+'</tr>'+rs.slice(0,200).map(r=>'<tr>'+r.map((v,i)=>`<td>${L[K[i]][v]}</td>`).join('')+'</tr>').join('');$('#mc').textContent=`Drill-through: ${rs.length.toLocaleString('es')} registros (se muestran 200)`;$('#md').showModal()}
$('#nav').innerHTML=PG.map((x,i)=>`<button class="nb" onclick="go(${i})">${i+1}. ${x.t}</button>`).join('');
$('#fgs').innerHTML=FD.map(k=>`<div class="fg"><b>${NM[k]}</b>${L[k].map((l,i)=>l==='Sin dato'?'':`<button class="chip" data-k="${k}" data-i="${i}">${l}</button>`).join('')}</div>`).join('');
$('#fgs').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)tog(b.dataset.k,L[b.dataset.k][+b.dataset.i])});
let tm;$('#q').addEventListener('input',e=>{clearTimeout(tm);tm=setTimeout(()=>{Q=e.target.value;render()},250)});
go(0);
</script></body></html>
